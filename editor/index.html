<script type="module">
import init, * as bindings from './pdfbigode-web-ed82254588840ccd.js';
const wasm = await init({ module_or_path: './pdfbigode-web-ed82254588840ccd_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    
    <script>
      // Text recognition for "Recognize text": Tesseract, served from ./tess with the app (nothing
      // leaves the browser). Loaded on first use; one worker per language set, kept for later pages.
      window.pdfbigodeOcr = (() => {
        const LANGS = { pt: ["por"], en: ["eng"], "pt+en": ["por", "eng"] };
        const base = new URL("./tess/", document.baseURI);
        let lib = null;
        const workers = new Map();
        function loadLib() {
          if (!lib) {
            lib = new Promise((resolve, reject) => {
              const s = document.createElement("script");
              s.src = new URL("tesseract.min.js", base).href;
              s.onload = () => resolve(window.Tesseract);
              s.onerror = () => { lib = null; reject(new Error("could not load text recognition")); };
              document.head.appendChild(s);
            });
          }
          return lib;
        }
        function worker(code) {
          const langs = LANGS[code] || LANGS.pt;
          const key = langs.join("+");
          if (!workers.has(key)) {
            const w = loadLib().then((T) =>
              T.createWorker(langs, 1, {
                workerPath: new URL("worker.min.js", base).href,
                corePath: new URL("core", base).href,
                langPath: new URL("lang", base).href,
                gzip: true,
              })
            );
            w.catch(() => workers.delete(key));
            workers.set(key, w);
          }
          return workers.get(key);
        }
        return async (rgba, width, height, code) => {
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").putImageData(new ImageData(rgba, width, height), 0, 0);
          const w = await worker(code);
          const { data } = await w.recognize(canvas, {}, { blocks: true, text: false });
          const lines = [];
          for (const block of data.blocks || [])
            for (const para of block.paragraphs || [])
              for (const line of para.lines || []) {
                const words = (line.words || [])
                  .filter((x) => x.text && x.text.trim())
                  .map((x) => [x.text, x.bbox.x0, x.bbox.y0, x.bbox.x1, x.bbox.y1]);
                if (words.length) lines.push(words);
              }
          return JSON.stringify(lines);
        };
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
