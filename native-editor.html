<!doctype html>
<html lang="pt-BR">
<head>
<script>(function(){try{var t=localStorage.getItem('pdftools-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDFTools 3 — Editor PDF Pro</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="stylesheet" href="/styles.css">
<style>
html,body{height:100%;margin:0;overflow:hidden}
.ed-shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
.ed-top{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.ed-back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}
.ed-back:hover{color:var(--text)}
.ed-top h1{margin:0;font-size:17px;font-weight:800;white-space:nowrap}
.ed-note{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.ed-stage{position:relative;flex:1 1 auto;min-height:0}
.ed-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.ed-loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);text-align:center;padding:16px}
.ed-loader-card{max-width:420px}
.ed-loader .spinner{width:28px;height:28px;border-width:3px;border-color:var(--accent);border-right-color:transparent;margin:0 0 14px}
.ed-loader-title{font-size:16px;font-weight:700;margin:0 0 6px}
.ed-loader.error .spinner{display:none}
@media(max-width:640px){.ed-note{display:none}}
</style>
</head>
<body>
<div class="ed-shell">
  <header class="ed-top">
    <a class="ed-back" href="/">← Voltar</a>
    <h1>Editor PDF Pro</h1>
    <span class="ed-note">Tudo processado no seu navegador: o PDF não sai do seu computador</span>
  </header>
  <main class="ed-stage">
    <!-- O editor é o PDF Bigode (Rust/WebAssembly), servido em /editor. "?host=parent" liga a
         ponte de mensagens: ele avisa quando está pronto e entrega o PDF salvo para esta página. -->
    <iframe id="edFrame" title="Editor PDF Pro" src="/editor/index.html?host=parent" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    <div class="ed-loader" id="edLoader" role="status" aria-live="polite">
      <div class="ed-loader-card">
        <span class="spinner"></span>
        <p class="ed-loader-title" id="edLoaderTitle">Carregando o editor…</p>
        <p class="hint" id="edLoaderHint">No primeiro acesso ele baixa cerca de 15 MB. Depois fica guardado no navegador e abre na hora.</p>
      </div>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/editor-host.js" defer></script>
</body>
</html>
